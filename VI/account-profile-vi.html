<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thông tin tài khoản — VietinCare AI</title>
  <link rel="stylesheet" href="../account.css">
  <link rel="stylesheet" href="../report.css">
  <link rel="stylesheet" href="../workspace.css">
</head>
<body>
  <main>
    <nav>
      <a href="index-vi.html">VietinCare AI</a>
      <a href="../EN/account-profile-en.html" lang="en">English</a>
    </nav>
    <h1>Thông tin tài khoản</h1>
    <p id="accountStatus" role="status" aria-live="polite">Đang kiểm tra phiên đăng nhập…</p>

    <section id="account" hidden>
      <div class="welcome">
        <div>
          <p class="eyebrow">VIETINCARE AI · THÔNG TIN TÀI KHOẢN</p>
          <h2 id="welcomeName"></h2>
          <p id="welcomeDescription">Chi tiết hồ sơ của bạn.</p>
        </div>
      </div>

      <div class="overview-grid">
        <section class="card profile">
          <p class="eyebrow">HỒ SƠ CỦA BẠN</p>
          <h2>Thông tin tài khoản</h2>
          <dl>
            <dt>Họ tên</dt>
            <dd id="name"></dd>
            <dt>Email</dt>
            <dd id="email"></dd>
            <dt>Vai trò</dt>
            <dd id="role"></dd>
          </dl>
          <p class="session-note">● Đã xác thực tài khoản</p>
        </section>
      </div>

      <footer class="workspace-footer">VietinCare AI · Hỗ trợ và chăm sóc khách hàng</footer>
    </section>

    <button id="logout" type="button">Đăng xuất</button>
  </main>
  <script src="../workspace.js"></script>
</body>
</html>
