<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Account details — VietinCare AI</title>
  <link rel="stylesheet" href="../account.css">
  <link rel="stylesheet" href="../report.css">
  <link rel="stylesheet" href="../workspace.css">
</head>
<body>
  <main>
    <nav>
      <a href="index-en.html">VietinCare AI</a>
      <a href="../VI/account-profile-vi.html" lang="vi">Tiếng Việt</a>
    </nav>
    <h1>Account details</h1>
    <p id="accountStatus" role="status" aria-live="polite">Checking your session…</p>

    <section id="account" hidden>
      <div class="welcome">
        <div>
          <p class="eyebrow">VIETINCARE AI · ACCOUNT DETAILS</p>
          <h2 id="welcomeName"></h2>
          <p id="welcomeDescription">Your profile details.</p>
        </div>
      </div>

      <div class="overview-grid">
        <section class="card profile">
          <p class="eyebrow">YOUR PROFILE</p>
          <h2>Account details</h2>
          <dl>
            <dt>Name</dt>
            <dd id="name"></dd>
            <dt>Email</dt>
            <dd id="email"></dd>
            <dt>Role</dt>
            <dd id="role"></dd>
          </dl>
          <p class="session-note">● Account authenticated</p>
        </section>
      </div>

      <footer class="workspace-footer">VietinCare AI · Customer care and support</footer>
    </section>

    <button id="logout" type="button">Sign out</button>
  </main>
  <script src="../workspace.js"></script>
</body>
</html>
